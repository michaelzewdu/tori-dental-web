name: Deploy CI(Webhook call)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Call Webhook
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
      - name: Deploy
        uses: superfly/flyctl-actions@1.3
        with:
          args: deploy --remote-only